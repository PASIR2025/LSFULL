<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324a">
<title>SimuPLC · CONTROL PRO V22 · KOP/FBD enlazado</title>
<style>
:root{
  --shell:#cbd5df;--panel:#f5f7f9;--panel2:#e8edf2;--paper:#fff;--ink:#172331;
  --muted:#64748b;--border:#a7b4c0;--accent:#0878bd;--select:#0ea5e9;--run:#0aad63;
  --live:#d81c1c;--return-live:#126fbe;--danger:#c62828;--grid:rgba(68,85,102,.13);--toolbar-h:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--shell);color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}
#app{width:100%;height:100%;display:flex;overflow:hidden;background:var(--shell)}
#library{width:104px;flex:0 0 104px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);box-shadow:3px 0 14px rgba(15,23,42,.10);transition:width .18s,flex-basis .18s,transform .18s;z-index:60;overflow:hidden}
body.library-hidden #library{width:0;flex-basis:0;border-right:0;box-shadow:none}
.lib-head{padding:6px 6px 5px;border-bottom:1px solid #cbd5df;display:grid;grid-template-columns:1fr auto;gap:4px;align-items:start;min-width:104px}
.lib-title{font-weight:950;letter-spacing:.2px;font-size:10px;line-height:1.05}.lib-sub{display:none}.lib-close{width:28px;height:28px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:900;color:#334155}
#profileCard{display:none}
.lib-scroll{min-width:104px;padding:6px;overflow:auto;flex:1}.lib-group{font-size:8px;font-weight:950;letter-spacing:.15px;color:#637384;margin:9px 1px 4px;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.part-btn{width:100%;height:50px;display:grid;grid-template-columns:1fr;place-items:center;border:1px solid #b7c2cc;border-radius:8px;background:#fff;color:#1f2937;padding:3px;margin-bottom:5px;transition:.12s}
.part-btn:hover{border-color:#7c9ab0;background:#f8fbfd}.part-btn.placing{outline:3px solid rgba(14,165,233,.23);border-color:var(--select);background:#edf9ff}
.part-icon{width:43px;height:43px;display:grid;place-items:center;overflow:hidden;background:#fff}.part-icon img{width:41px;height:41px;object-fit:contain}.part-icon.power-icon{font:950 19px Consolas;color:#172331;border-radius:50%}
.lib-foot{min-width:104px;padding:5px;border-top:1px solid #cbd5df;display:grid;grid-template-columns:1fr;gap:4px}.lib-foot button{height:34px;border:1px solid var(--border);background:#fff;border-radius:8px;font-weight:850;color:#334155}.lib-foot .danger{color:#a11d1d;border-color:#e7a8a8}
#main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative}
#toolbar{height:var(--toolbar-h);min-height:var(--toolbar-h);display:flex;align-items:center;gap:5px;padding:5px 7px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;z-index:50}
.tool{height:36px;min-width:36px;padding:0 10px;border:1px solid #9eabb7;border-radius:8px;background:#fff;color:#273747;font-weight:850}.tool:hover{background:#eef5f9}.tool.primary{background:#e9f6fc;border-color:#79b8da;color:#075985}.tool.running{background:#fee2e2;border-color:#ef4444;color:#991b1b}.tool.danger{color:#a11d1d}.tool.icon{width:38px;padding:0;font-size:17px}.tool.sim-toggle{font-size:20px;font-weight:950;line-height:1}.spacer{flex:1 0 12px}.badge{height:30px;display:inline-flex;align-items:center;padding:0 9px;border:1px solid #b8c2cc;border-radius:999px;background:#e9eef3;font:850 10px Consolas;color:#334155}.badge.on{background:#dff8e8;color:#126338;border-color:#8fd3aa}.nav-tool{height:34px;min-width:48px;padding:0 9px;border:1px solid #94a3b8;border-radius:999px;background:#fff;color:#334155;font:900 10px Arial;flex:0 0 auto}.nav-tool:hover{background:#eef5f9}.nav-tool.active{background:#00e887;border-color:#00a861;color:#042d1d;box-shadow:0 0 0 2px rgba(0,232,135,.14)}.nav-divider{width:1px;height:28px;background:#aab5bf;flex:0 0 1px;margin:0 2px}.badge.program{background:#eaf7ff;border-color:#7db8d7;color:#075985}.program-source{height:32px;border:1px solid #7db8d7;border-radius:8px;background:#f0f9ff;color:#075985;font:900 10px Arial;padding:0 6px;outline:none;flex:0 0 auto}.program-source:disabled{opacity:.58}.program-source-label{font:900 9px Arial;color:#475569;flex:0 0 auto}
#viewport{position:relative;flex:1;min-height:0;overflow:hidden;background:#73808a;touch-action:none;cursor:grab;user-select:none}#viewport.panning{cursor:grabbing}#viewport.placing{cursor:crosshair}
#world{position:absolute;left:0;top:0;width:4400px;height:3000px;transform-origin:0 0;will-change:transform}
#paper{position:absolute;inset:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;box-shadow:inset 0 0 0 2px #596876}
#wires{position:absolute;inset:0;width:4400px;height:3000px;overflow:visible;z-index:5;pointer-events:none}
.wire{fill:none;stroke:#172331;stroke-width:4.2;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.wire.live{stroke:var(--live);stroke-width:4.8}.wire.return-live{stroke:var(--return-live);stroke-width:4.8}.wire.selected{stroke:var(--select);stroke-width:5.4}.wire-hit{fill:none;stroke:rgba(0,0,0,0);stroke-width:34;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer;touch-action:none}.wire-handle{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;vector-effect:non-scaling-stroke;cursor:grab;pointer-events:all;touch-action:none}.wire-handle.dragging{fill:#38bdf8;cursor:grabbing}.junction{fill:#111827;stroke:#fff;stroke-width:1.1;vector-effect:non-scaling-stroke;pointer-events:none}.junction.live{fill:var(--live)}.junction.return-live{fill:var(--return-live)}.junction.pending-junction{fill:#111827;stroke:var(--select);stroke-width:3}.junction-hit{fill:rgba(0,0,0,0);stroke:rgba(0,0,0,0);stroke-width:18;vector-effect:non-scaling-stroke;pointer-events:all;cursor:crosshair;touch-action:none}.device.connector{width:54px;height:54px}.connector-stage{position:absolute;inset:0;pointer-events:none;transform-origin:50% 50%}.connector-stage svg{width:100%;height:100%;overflow:visible}.connector-stroke{fill:none;stroke:#172331;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.connector-dot{fill:#172331;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}.device.connector.live .connector-stroke,.device.connector.live .connector-dot{stroke:var(--live);fill:var(--live)}.device.connector.return-live .connector-stroke,.device.connector.return-live .connector-dot{stroke:var(--return-live);fill:var(--return-live)}
.device{position:absolute;z-index:10;background:transparent;border:0;touch-action:none;user-select:none;cursor:default;pointer-events:none}.device-body-hit{position:absolute;inset:10px 12px;z-index:6;background:transparent;pointer-events:auto;touch-action:none;cursor:grab}.device.connector .device-body-hit{inset:5px}.device.plc .device-body-hit{inset:3px}.device.dragging .device-body-hit{cursor:grabbing}.device.dragging{cursor:grabbing;z-index:24}.device.selected::after{content:"";position:absolute;inset:-6px;border:1.5px dashed var(--select);border-radius:5px;pointer-events:none}.device.live .symbol-stage{filter:drop-shadow(0 0 3px rgba(216,28,28,.38))}.device.return-live .symbol-stage{filter:drop-shadow(0 0 3px rgba(18,111,190,.38))}.symbol-stage img.live-tint{filter:invert(16%) sepia(91%) saturate(5302%) hue-rotate(353deg) brightness(87%) contrast(109%)}.symbol-stage img.return-tint{filter:invert(38%) sepia(97%) saturate(1174%) hue-rotate(178deg) brightness(88%) contrast(95%)}
.symbol-stage{position:absolute;inset:0;pointer-events:none;transform-origin:50% 50%}.symbol-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.contact-mask{display:none;position:absolute;left:34%;right:31%;top:27%;bottom:22%;background:#fff;pointer-events:none}.simulating .device.contact .contact-mask{display:block}
.contact-blade{display:none;position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}.simulating .device.contact .contact-blade{display:block}.contact-blade path{stroke:#111;stroke-width:4.4;fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}.device.closed .contact-blade path{stroke:var(--live)}
.side-name{position:absolute;right:calc(100% - 12px);left:auto;top:50%;transform:translateY(-50%);min-width:38px;pointer-events:none;line-height:1;text-align:right;text-shadow:0 1px 0 #fff;z-index:5}.side-name.label-far{right:calc(100% + 9px)}.side-name.label-far-soft{right:calc(100% + 5px)}.side-name.label-mid{right:calc(100% - 7px)}.side-name.label-near{right:calc(100% - 24px)}.side-name .tag{display:block;font:950 13px Consolas;color:#075985;white-space:nowrap}.side-name .label{display:none!important}
.term{position:absolute;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%);z-index:20;background:transparent;cursor:crosshair;touch-action:none;pointer-events:auto}.term::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);background:transparent;border:1px solid transparent;transition:.1s}.device:hover .term::after,.term:hover::after,.term.pending::after,.wiring .term::after{background:#fff;border-color:#0b74a9;box-shadow:0 0 0 4px rgba(14,165,233,.22)}.term.pending::after{background:#38bdf8;border-color:#0369a1;box-shadow:0 0 0 6px rgba(14,165,233,.28)}
.simulating .term{pointer-events:none!important;cursor:default}.simulating .term::after{display:none!important}.term-label{display:block;position:absolute;left:calc(50% + 7px);top:50%;transform:translateY(-50%);font:950 11px Consolas;color:#334155;white-space:nowrap;pointer-events:none;text-shadow:0 1px 0 #fff,0 0 2px #fff}.term.pending .term-label{color:#0369a1}
.power-device{width:82px;height:82px}.power-symbol{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}.power-symbol .ptext{font:950 20px Consolas;color:#111827;line-height:1}.power-symbol .pcircle{width:28px;height:28px;border:4px solid #111827;border-radius:50%;background:#fff;margin-top:5px}.power-symbol .stem{width:4px;height:24px;background:#111827}.power-device.return .power-symbol{flex-direction:column-reverse}.power-device.return .power-symbol .pcircle{margin-top:0;margin-bottom:5px}
.device.contact{width:82px;height:82px}.device.coil,.device.pilot{width:82px;height:82px}.device.pilot.live::before{content:"";position:absolute;left:25%;top:25%;width:50%;height:50%;border-radius:50%;background:var(--pilot-glow-bg,rgba(34,197,94,.18));box-shadow:0 0 17px var(--pilot-glow,#22c55e);pointer-events:none}.device.pilot.live[data-pilot-color="green"] .symbol-stage img{filter:brightness(0) saturate(100%) invert(58%) sepia(74%) saturate(505%) hue-rotate(84deg) brightness(92%) contrast(91%)}.device.pilot.live[data-pilot-color="red"] .symbol-stage img{filter:brightness(0) saturate(100%) invert(16%) sepia(91%) saturate(5302%) hue-rotate(353deg) brightness(87%) contrast(109%)}.device.pilot.live[data-pilot-color="amber"] .symbol-stage img{filter:brightness(0) saturate(100%) invert(77%) sepia(87%) saturate(1516%) hue-rotate(349deg) brightness(103%) contrast(101%)}.device.pilot.live[data-pilot-color="blue"] .symbol-stage img{filter:brightness(0) saturate(100%) invert(42%) sepia(97%) saturate(1850%) hue-rotate(187deg) brightness(93%) contrast(96%)}.device.pilot.live[data-pilot-color="white"] .symbol-stage img{filter:brightness(0) invert(1)}.device.coil.live::before{content:"";position:absolute;left:23%;right:23%;top:30%;bottom:30%;border-radius:5px;background:rgba(216,28,28,.08);box-shadow:0 0 12px rgba(216,28,28,.52);pointer-events:none}
.device.plc{width:690px;height:260px;background:#fff;border:2px solid #1c2b38;border-radius:5px;box-shadow:0 2px 7px rgba(0,0,0,.10)}.device.plc.powered{box-shadow:0 0 0 2px rgba(14,165,233,.10),0 2px 7px rgba(0,0,0,.10)}.plc-face{position:absolute;inset:0;pointer-events:none}.plc-title{position:absolute;left:50%;top:92px;transform:translateX(-50%);text-align:center;min-width:250px}.plc-title b{display:block;font-size:18px;letter-spacing:.2px}.plc-title span{display:block;font-size:9px;font-weight:850;color:#64748b;margin-top:3px}.plc-strip{position:absolute;left:10px;font:900 9px Arial;color:#334155}.plc-strip.in{top:7px}.plc-strip.out{bottom:6px}.plc-tag{position:absolute;transform:translateX(-50%);font:900 8px Consolas;color:#334155}.plc-power-state{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:6px;font:900 9px Consolas;color:#64748b}.plc-power-led{width:11px;height:11px;border-radius:50%;background:#94a3b8;box-shadow:inset 0 0 0 1px #64748b}.device.plc.powered .plc-power-led{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.75),inset 0 0 0 1px #15803d}.device.plc.powered .plc-power-state{color:#166534}.plc-input-led{position:absolute;top:46px;width:8px;height:8px;border-radius:50%;transform:translateX(-50%);background:#cbd5e1;border:1px solid #94a3b8}.plc-input-led.on{background:var(--live);border-color:#991b1b;box-shadow:0 0 6px rgba(216,28,28,.55)}.plc-qbox{position:absolute;bottom:22px;width:70px;height:51px;transform:translateX(-50%);border:1px solid #94a3b8;border-radius:5px;pointer-events:auto;cursor:pointer;background:#f8fafc}.plc-qbox.disabled{opacity:.58;cursor:not-allowed}.plc-qbox.on{background:#fee2e2;border-color:#ef4444}.plc-qbox b{display:block;text-align:center;font:900 9px Consolas;margin-top:3px}.plc-qbox .relay{position:absolute;left:8px;right:8px;top:20px;height:18px}.plc-qbox .relay::before,.plc-qbox .relay::after{content:"";position:absolute;top:8px;width:10px;height:2px;background:#172331}.plc-qbox .relay::before{left:0}.plc-qbox .relay::after{right:0}.plc-qbox .blade{position:absolute;left:10px;top:2px;width:32px;height:2px;background:#172331;transform-origin:left center;transform:rotate(-24deg)}.plc-qbox.on .blade{background:var(--live);transform:rotate(0deg)}.part-btn[data-type^="plc_"] .part-icon{font:950 9px/1 Consolas;color:#0f4c75;text-align:center;letter-spacing:-.2px}
#properties{position:absolute;right:10px;top:58px;width:285px;max-height:calc(100% - 74px);overflow:auto;padding:10px;background:rgba(248,250,252,.98);border:1px solid #8d9aa6;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.25);z-index:80;display:none}.properties-open #properties{display:block}.prop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.prop-head b{font-size:13px}.prop-close{width:30px;height:30px;border:1px solid #a8b3bd;border-radius:7px;background:#fff;font-weight:900}.prop-row{display:block;font-size:10px;font-weight:850;color:#475569;margin:8px 0}.prop-row input,.prop-row select{width:100%;height:34px;margin-top:3px;border:1px solid #aab5bf;border-radius:7px;padding:6px 8px;background:#fff;color:#182532;font-weight:800}.prop-row[hidden]{display:none!important}.prop-info{font-size:10px;color:#64748b;line-height:1.4;padding:7px 8px;background:#eef3f7;border-radius:7px}.prop-actions{display:flex;gap:6px;margin-top:10px}.prop-actions button{flex:1;height:34px;border:1px solid #9aa7b2;border-radius:8px;background:#fff;font-weight:850}.prop-actions .danger{color:#a11d1d;border-color:#e6aaaa}
#statusbar{position:absolute;left:10px;bottom:10px;z-index:40;display:flex;gap:5px;pointer-events:none}.status-pill{height:28px;display:flex;align-items:center;padding:0 9px;border-radius:999px;background:rgba(15,23,42,.88);color:#fff;font:800 10px Consolas;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:150;background:#101827;color:#fff;padding:8px 14px;border-radius:999px;font:800 11px Arial;opacity:0;transition:.16s;pointer-events:none}
@media(max-width:760px){
  #library{position:absolute;left:0;top:0;bottom:0;width:104px;flex-basis:104px;transform:translateX(-100%);box-shadow:5px 0 22px rgba(0,0,0,.25)}body.library-open #library{transform:translateX(0);width:104px;flex-basis:104px}body.library-hidden #library{width:104px;flex-basis:104px;transform:translateX(-100%)}
  .lib-head,.lib-scroll,.lib-foot{min-width:104px}.part-btn{grid-template-columns:1fr;height:50px}.part-icon{width:42px;height:42px}.part-icon img{width:40px;height:40px}
  .tool{padding:0 8px}.tool .wide{display:none}.nav-tool{min-width:44px;padding:0 7px;font-size:9px}.badge.profile{display:none}#properties{right:5px;top:54px;width:min(285px,88vw);max-height:calc(100% - 62px)}
  .side-name{min-width:38px;max-width:70px}
  .term{width:46px;height:46px}
  .wire-hit{stroke-width:44}

</style>
</head>
<body>
<div id="app">
  <aside id="library">
    <div class="lib-head"><div><div class="lib-title">CONTROL PRO</div><div class="lib-sub">Lógica cableada · IEC · Simulación en tiempo real</div></div><button id="libClose" class="lib-close" title="Ocultar biblioteca">×</button><div id="profileCard"><b id="profileName">CONTROL</b><span id="profileDesc">Circuito de mando</span></div></div>
    <div id="libraryScroll" class="lib-scroll"></div>
    <div class="lib-foot"><button id="fitBtn">Ajustar</button><button id="clearBtn" class="danger">Vaciar</button></div>
  </aside>
  <main id="main">
    <div id="toolbar">
      <button id="navFbdBtn" class="nav-tool" title="Ir a FBD">FBD</button>
      <button id="navLadderBtn" class="nav-tool" title="Ir a Ladder / KOP">KOP</button>
      <button id="navControlBtn" class="nav-tool active" title="Editor de control">CONTROL</button>
      <button id="navHmiBtn" class="nav-tool" title="Ir a HMI">HMI</button>
      <span class="nav-divider" aria-hidden="true"></span>
      <button id="libraryBtn" class="tool icon primary" title="Mostrar / ocultar biblioteca">☰</button>
      <button id="runBtn" class="tool icon sim-toggle" title="Iniciar simulación" aria-label="Iniciar simulación">▶</button>
      <button id="duplicateBtn" class="tool icon" title="Duplicar">⧉</button>
      <button id="rotateBtn" class="tool icon" title="Rotar 90°">↻</button>
      <button id="propertiesBtn" class="tool icon" title="Propiedades del elemento seleccionado">⚙</button>
      <button id="deleteBtn" class="tool icon danger" title="Eliminar / Supr">⌫</button>
      <button id="zoomOut" class="tool icon" title="Alejar">−</button>
      <button id="zoomIn" class="tool icon" title="Acercar">+</button>
      <button id="fitTop" class="tool" title="Ajustar a pantalla">Ajustar</button>
      <span class="spacer"></span>
      <span id="modeBadge" class="badge">DISEÑO</span>
      <span id="elementCount" class="badge">0 ELEMENTOS</span>
      <span id="zoomBadge" class="badge">100%</span>
      <span class="program-source-label">PROGRAMA PLC</span><select id="programSourceSelect" class="program-source" title="Programa que ejecutará el PLC en CONTROL"><option value="ladder">KOP</option><option value="fbd">FBD</option></select>
      <span id="programBadge" class="badge program">PLC ↔ KOP</span><span id="profileBadge" class="badge profile">CONTROL</span>
    </div>
    <div id="viewport">
      <div id="world"><div id="paper"><svg id="wires"></svg></div></div>
      <div id="statusbar"><div id="statusMode" class="status-pill">DISEÑO</div><div class="status-pill">Rueda = zoom · Arrastra fondo = desplazar · PLC: conecta +24 V a L+ y 0 V a M</div></div>
    </div>
    <section id="properties">
      <div class="prop-head"><b>Propiedades</b><button id="propClose" class="prop-close">×</button></div>
      <label class="prop-row">Referencia<input id="propTag" maxlength="18" placeholder="S1, KM1, H1..."></label>
      <label class="prop-row">Nombre / descripción<input id="propLabel" maxlength="36"></label>
      <label id="pilotColorRow" class="prop-row" hidden>Color del piloto<select id="propPilotColor"><option value="green">Verde</option><option value="red">Rojo</option><option value="amber">Ámbar</option><option value="blue">Azul</option><option value="white">Blanco</option></select></label>
      <div id="propInfo" class="prop-info"></div>
      <div class="prop-actions"><button id="propApply">Aplicar</button><button id="propDelete" class="danger">Eliminar</button></div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script>
(function(){
