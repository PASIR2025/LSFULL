<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico COM Windows - SimuPLC</title><style>body{font:16px system-ui;max-width:680px;margin:30px auto;padding:16px}button{padding:15px;margin:8px 0;background:#067c48;color:white;border:0;border-radius:8px;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:16px;border-radius:8px}</style></head><body><h2>Diagnóstico del puerto COM — SimuPLC</h2><p>Conecta el Arduino UNO por USB. Esta prueba <b>no programa ni modifica el Arduino</b>; solamente comprueba si Chrome/Edge puede mostrar el selector COM.</p><button id="check">1. Revisar disponibilidad</button><button id="choose">2. Seleccionar puerto COM</button><pre id="out">Esperando prueba…</pre><script>const out=document.getElementById('out');function log(s){out.textContent+='\n'+s;}document.getElementById('check').onclick=async()=>{out.textContent='Origen: '+location.origin+'\nHTTPS: '+isSecureContext+'\nWeb Serial: '+!!navigator.serial+'\nContexto iframe: '+(window.top!==window.self)+'\nActivación: '+(navigator.userActivation?.isActive??'no disponible');if(navigator.serial){try{const ports=await navigator.serial.getPorts();log('Puertos previamente autorizados: '+ports.length);ports.forEach((p,i)=>log('Puerto '+(i+1)+': '+JSON.stringify(p.getInfo())));}catch(e){log('getPorts: '+e.name+' — '+e.message);}}};document.getElementById('choose').onclick=async()=>{out.textContent='Solicitando selector COM…\nActivación: '+(navigator.userActivation?.isActive??'no disponible');try{if(!navigator.serial)throw Error('Web Serial no disponible');const p=await navigator.serial.requestPort();log('ÉXITO: puerto seleccionado. '+JSON.stringify(p.getInfo()));}catch(e){log('ERROR: '+e.name+' — '+e.message);log('Activación después: '+(navigator.userActivation?.isActive??'no disponible'));}};</script></body></html>
