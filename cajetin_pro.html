<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SimuPLC · Compositor PDF / Cajetín PRO</title>
<style>
:root{
  --bg:#dfe4ea;--bar:#0b1220;--bar2:#172033;--line:#111827;--muted:#64748b;
  --accent:#0f4c81;--accent2:#2563eb;--soft:#eff6ff;--danger:#b91c1c;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#0f172a;overflow:hidden}
button,input,select{font:inherit}
button,select{cursor:pointer}

/* Cinta CAD compacta */
.topbar{
  position:relative;z-index:300;height:52px;display:flex;align-items:center;gap:6px;
  padding:7px 10px;background:var(--bar);color:#fff;box-shadow:0 3px 16px rgba(0,0,0,.25);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;
}
.topbar::-webkit-scrollbar{height:5px}.topbar::-webkit-scrollbar-thumb{background:#475569;border-radius:10px}
.brand{font-weight:900;font-size:14px;margin-right:2px;flex:0 0 auto;letter-spacing:.1px}
.sep{width:1px;height:24px;background:#334155;flex:0 0 auto;margin:0 2px}
.topbar button,.topbar select{
  flex:0 0 auto;height:36px;min-height:36px;border:1px solid #334155;border-radius:8px;
  padding:0 9px;background:var(--bar2);color:#fff;font-size:12px;font-weight:800;outline:none;
}
.topbar button:hover,.topbar select:hover{border-color:#64748b;background:#202b40}
.topbar button.primary{background:var(--accent);border-color:#1d6aa8}
.topbar button.active{background:#1d4ed8;border-color:#60a5fa}
.topbar .zoom-value{min-width:54px;text-align:center;color:#dbeafe;background:#111a2b}
#sheetPropsBtn,#mergeCells,#unmergeCell,#addFreeText,#saveLocal,#loadLocal,#printPdf,#undoBtn,#redoBtn,#zoomOut,#zoomIn,#fitZoom{width:38px;min-width:38px;padding:0;display:inline-flex;align-items:center;justify-content:center}
#printPdf{width:52px;min-width:52px;gap:3px;padding:0 6px}
#printPdf .pdf-download-arrow{font-size:15px;font-weight:950;line-height:1;transform:translateY(-1px)}
#rowAction{width:88px;max-width:88px;padding-right:22px}
#colAction{width:102px;max-width:102px;padding-right:22px}
.topbar .icon-btn svg{width:17px;height:17px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.topbar .icon-btn{font-size:0;line-height:0}
.topbar .icon-btn.primary svg{stroke:#fff}
.topbar .icon-btn:disabled{opacity:.4;cursor:not-allowed}
.topbar .icon-btn:hover{transform:translateY(-1px)}

.workspace{
  position:relative;height:calc(100vh - 52px);overflow:auto;padding:0;
  display:block;overscroll-behavior:contain;touch-action:none;cursor:default;
  background:
    linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px),
    #dce2e8;
  background-size:24px 24px;
}
.stage{position:relative;min-width:100%;min-height:100%;width:max-content;height:max-content;padding:28px;display:flex;align-items:center;justify-content:center}.paper-shell{position:relative;margin:0;flex:0 0 auto;transition:width .12s ease,height .12s ease}
.paper{
  position:absolute;left:0;top:0;background:#fff;box-shadow:0 18px 52px rgba(15,23,42,.28);
  transform-origin:top left;user-select:none;-webkit-user-select:none;touch-action:none;
  outline:1px solid rgba(15,23,42,.18);
}
.paper.a4.landscape{width:1122px;height:793px}.paper.a4.portrait{width:793px;height:1122px}
.paper.a3.landscape{width:1587px;height:1122px}.paper.a3.portrait{width:1122px;height:1587px}
.frame{position:absolute;left:28px;right:28px;top:28px;bottom:28px;border:2px solid #111827;pointer-events:none;z-index:1;display:none}.sheet-border{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:1;display:none}.scheme-area{z-index:10}.titleblock{z-index:60}.logo{z-index:120!important}.workspace.panning{cursor:grabbing}.workspace.pan-ready{cursor:grab}
.scheme-area{
  position:absolute;left:44px;right:44px;top:44px;bottom:245px;display:flex;align-items:center;justify-content:center;
  border:1px dashed #cbd5e1;color:#94a3b8;font-weight:900;font-size:24px;pointer-events:none;
}
.logo{
  position:absolute;left:54px;top:50px;font-weight:900;font-size:22px;color:var(--accent);
  pointer-events:none;z-index:120!important;background:#fff;padding:2px 5px 3px 2px;border-radius:3px;
  isolation:isolate;
}
.titleblock{
  position:absolute;left:44px;right:44px;bottom:44px;height:180px;border:2px solid var(--line);background:#fff;
  display:grid;overflow:visible;touch-action:none;
}
.cell{
  position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;
  overflow:hidden;cursor:pointer;background:#fff;min-width:0;min-height:0;
}
.cell:hover{background:#f8fafc}.cell.selected{outline:3px solid var(--accent2);outline-offset:-3px;background:var(--soft);z-index:2}
.cell.merge-pick{outline:3px solid #06b6d4;outline-offset:-3px;background:#ecfeff;z-index:3}.cell.merged{background:#fff}
.cell .label{font-size:9px;font-weight:900;color:#475569;text-transform:uppercase;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.15}
.cell .value{font-size:13px;font-weight:800;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.25;max-width:100%}
.cell.auto .value{color:var(--accent)}

/* Handles grandes pero invisibles */
.dragbar{position:absolute;z-index:30;background:transparent;touch-action:none}
.dragbar.v{top:0;bottom:0;width:16px;cursor:col-resize;transform:translateX(-8px)}
.dragbar.h{left:0;right:0;height:16px;cursor:row-resize;transform:translateY(-8px)}
.dragbar::after{content:"";position:absolute;background:transparent;transition:background .08s ease,box-shadow .08s ease}
.dragbar.v::after{top:0;bottom:0;left:7px;width:2px}.dragbar.h::after{left:0;right:0;top:7px;height:2px}
.dragbar:hover::after{background:#3b82f6;box-shadow:0 0 0 1px rgba(59,130,246,.18)}
.dragbar.active::after{background:#0b63ce;box-shadow:0 0 0 2px rgba(37,99,235,.2)}

/* Handles exteriores: redimensionan solo el cajetín completo */
.outer-handle{position:absolute;z-index:45;touch-action:none;background:transparent}
.outer-handle::after{content:"";position:absolute;background:transparent;transition:.08s ease}
.outer-handle.top{left:-10px;right:-10px;top:-12px;height:22px;cursor:ns-resize}.outer-handle.top::after{left:8px;right:8px;top:10px;height:2px}
.outer-handle.bottom{left:-10px;right:-10px;bottom:-12px;height:22px;cursor:ns-resize}.outer-handle.bottom::after{left:8px;right:8px;bottom:10px;height:2px}
.outer-handle.left{top:-10px;bottom:-10px;left:-12px;width:22px;cursor:ew-resize}.outer-handle.left::after{top:8px;bottom:8px;left:10px;width:2px}
.outer-handle.right{top:-10px;bottom:-10px;right:-12px;width:22px;cursor:ew-resize}.outer-handle.right::after{top:8px;bottom:8px;right:10px;width:2px}
.outer-handle:hover::after,.outer-handle.active::after{background:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.16)}
body.merge-mode .cell{cursor:cell} body.merge-mode .dragbar{pointer-events:none}

.drag-tip{
  position:fixed;z-index:1000;pointer-events:none;display:none;max-width:220px;padding:7px 10px;border-radius:999px;
  background:#0f172a;color:#fff;font-size:11px;font-weight:900;box-shadow:0 8px 22px rgba(15,23,42,.3);text-align:center;
}
.drag-tip.good{background:#047857}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;z-index:700;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(15,23,42,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.modal-backdrop.open{display:flex}
.modal-card{
  width:min(420px,calc(100vw - 28px));background:#fff;border:1px solid rgba(148,163,184,.45);border-radius:20px;
  box-shadow:0 24px 70px rgba(15,23,42,.32);padding:18px;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.modal-title{font-size:15px;font-weight:950;letter-spacing:.3px}.modal-loc{font-size:11px;color:#64748b;font-weight:800}
.modal-close{width:32px;height:32px;border:0;border-radius:9px;background:#f1f5f9;color:#334155;font-weight:900}
.field{display:block;font-size:11px;font-weight:900;color:#475569;margin:0 0 5px}
.text,.sel{width:100%;height:40px;border:1px solid #cbd5e1;border-radius:10px;padding:0 10px;background:#fff;color:#0f172a;font-size:13px;font-weight:800;outline:none}
.text:focus,.sel:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.gap{height:10px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal-actions button{height:38px;border-radius:10px;border:1px solid #cbd5e1;padding:0 12px;background:#fff;color:#0f172a;font-weight:850}
.modal-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}.modal-actions .danger{background:#fff1f2;border-color:#fecdd3;color:#991b1b}


/* Biblioteca local de cajetines */
.saved-card{width:min(560px,calc(100vw - 28px));max-height:min(82vh,720px);display:flex;flex-direction:column}
.save-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.save-row button{height:40px;border-radius:10px;border:1px solid var(--accent);padding:0 14px;background:var(--accent);color:#fff;font-weight:900}
.saved-list{margin-top:14px;overflow:auto;border-top:1px solid #e2e8f0;padding-top:10px;min-height:100px}
.saved-empty{padding:24px 12px;text-align:center;color:#64748b;font-size:12px;font-weight:800}
.saved-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid #eef2f7}
.saved-meta{min-width:0}.saved-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-sub{font-size:10px;color:#64748b;font-weight:750;margin-top:3px}
.saved-item button{height:34px;border-radius:9px;border:1px solid #cbd5e1;padding:0 10px;background:#fff;font-size:11px;font-weight:850}.saved-item .open-btn{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}.saved-item .del-btn{background:#fff1f2;border-color:#fecdd3;color:#991b1b}
.pan-hint{position:fixed;right:14px;bottom:14px;z-index:80;padding:7px 10px;border-radius:10px;background:rgba(15,23,42,.78);color:#fff;font-size:10px;font-weight:800;pointer-events:none;opacity:.78}
@media(max-width:700px){.pan-hint{display:none}.saved-item{grid-template-columns:minmax(0,1fr) auto}.saved-item .del-btn{grid-column:2}.saved-card{max-height:86vh}}

.toast{position:fixed;z-index:1200;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  padding:10px 14px;border-radius:12px;background:#0f172a;color:#fff;font-size:12px;font-weight:850;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:.2s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:700px){
  .topbar{height:50px;padding:7px 8px}.brand{font-size:12px}.workspace{height:calc(100vh - 50px);padding:0}.stage{padding:14px}
  .topbar button,.topbar select{height:34px;min-height:34px;padding:0 8px;font-size:11px}
  .dragbar.v{width:22px;transform:translateX(-11px)}.dragbar.h{height:22px;transform:translateY(-11px)}
  .outer-handle.top,.outer-handle.bottom{height:28px}.outer-handle.left,.outer-handle.right{width:28px}
}


/* V5 · selección, formato y objetos libres */
.cell.range-selected{background:#dbeafe;box-shadow:inset 0 0 0 2px rgba(37,99,235,.55);z-index:3}
.format-grid{display:grid;grid-template-columns:minmax(0,1.5fr) 82px 64px;gap:8px;align-items:end}
.color-input{width:100%;height:40px;padding:4px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.bg-preset-wrap{margin-top:10px;padding:10px;border:1px solid #dbe2ea;border-radius:12px;background:#f8fafc}
.bg-preset-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.bg-preset-row button{height:40px;border:1px solid #cbd5e1;border-radius:10px;padding:0 11px;background:#fff;color:#334155;font-size:11px;font-weight:900;white-space:nowrap}
.bg-preset-row button:hover{border-color:#60a5fa;background:#eff6ff}

.format-toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.format-toolbar button{width:38px;height:36px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font-weight:900}
.format-toolbar button.active{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8}.align-btn[data-align="center"]{text-align:center}.align-btn[data-align="right"]{text-align:right}
.mini-sel{height:36px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:0 8px;font-weight:800;color:#334155}
.textarea{width:100%;resize:vertical;min-height:78px;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;font:inherit;font-weight:750;outline:none}.textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.free-text-layer{position:absolute;inset:0;z-index:18;pointer-events:none}.free-text{position:absolute;min-width:24px;min-height:20px;padding:3px 5px;white-space:pre-wrap;cursor:move;pointer-events:auto;touch-action:none;border:0!important;outline:0!important;background:transparent!important;border-radius:0;user-select:none}.free-text:hover,.free-text.selected{border:0!important;outline:0!important;background:transparent!important;box-shadow:none!important}
body.selecting-cells .cell{cursor:crosshair}
@media(max-width:700px){.format-grid{grid-template-columns:1fr 74px 58px}.free-text{min-width:34px;min-height:28px;padding:5px 7px;border:0!important;outline:0!important;background:transparent!important}#rowAction{width:82px;max-width:82px}#colAction{width:94px;max-width:94px}.topbar .icon-btn{width:36px;min-width:36px}}


.sheet-props-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-props-grid .full{grid-column:1/-1}
.props-check{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;color:#334155;padding:9px 10px;border:1px solid #dbe2ea;border-radius:10px;background:#f8fafc}
.props-check input{width:17px;height:17px}
@media(max-width:560px){.sheet-props-grid{grid-template-columns:1fr}}
body.titleblock-hidden .titleblock{display:none!important}
@media print{
  @page{margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  .topbar,.modal-backdrop,.drag-tip,.toast,.pan-hint{display:none!important}
  .workspace{height:auto;overflow:visible;padding:0;background:#fff}
  .stage{min-width:0;min-height:0;width:auto;height:auto;padding:0;display:block}
  .paper-shell{width:auto!important;height:auto!important;margin:0}
  .paper{position:relative;transform:none!important;box-shadow:none;outline:none}
  .dragbar,.outer-handle{display:none!important}.cell.selected,.cell.merge-pick,.cell.range-selected{outline:none!important;background:#fff;box-shadow:none}.free-text.selected{outline:none;background:transparent}.scheme-area{border-color:#e5e7eb}
}

/* ===== SimuPLC V25 · integración del circuito dentro de la hoja ===== */
#backToSimuPLC{display:none;width:72px}
body.simuplc-embedded #backToSimuPLC{display:inline-block}
#simuplcPlanBadge{display:none;flex:0 0 auto;height:28px;align-items:center;padding:0 9px;border-radius:999px;font:900 10px Arial,sans-serif}
body.simuplc-embedded #simuplcPlanBadge{display:none}
body.simuplc-embedded.simuplc-free-pdf #simuplcPlanBadge{display:inline-flex;background:#fef3c7;color:#92400e}
.scheme-area{overflow:hidden!important;position:absolute!important}
#schemePlaceholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#94a3b8}
#simuplcImportedScheme{position:absolute;inset:8px;overflow:hidden;pointer-events:none;z-index:10}
#simuplcImportedScheme iframe,#simuplcImportedScheme img{position:absolute;left:50%;top:50%;border:0;max-width:none!important;max-height:none!important;transform-origin:center center;pointer-events:none;background:#fff}
body.simuplc-has-scheme .scheme-area{border-color:transparent!important;color:transparent!important}
body.simuplc-has-scheme #schemePlaceholder{display:none}
#logo img{display:block;width:150px;max-height:42px;object-fit:contain;object-position:left center}
body.simuplc-free-pdf #rowAction,
body.simuplc-free-pdf #colAction,
body.simuplc-free-pdf #mergeCells,
body.simuplc-free-pdf #unmergeCell,
body.simuplc-free-pdf #addFreeText,
body.simuplc-free-pdf #saveLocal,
body.simuplc-free-pdf #loadLocal{display:none!important}
body.simuplc-free-pdf .titleblock{display:none!important}
body.simuplc-free-pdf .scheme-area{bottom:44px!important}
body.simuplc-free-pdf #templateSelect{opacity:.55;pointer-events:none}
body.simuplc-free-pdf #showLogo{pointer-events:none}
body.simuplc-free-pdf label[for="templateSelect"]::after{content:" · PRO";color:#b45309}
@media print{#simuplcImportedScheme{inset:6px!important}.scheme-area{border:none!important}#schemePlaceholder{display:none!important}#backToSimuPLC,#simuplcPlanBadge,.pan-hint{display:none!important}}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <button id="backToSimuPLC" title="Volver a SimuPLC">← Volver</button>
  <span id="simuplcPlanBadge">FREE</span>
  <button id="printPdf" class="icon-btn primary" title="Descargar / exportar PDF" aria-label="Descargar PDF"><svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/><path d="M8 13h8"/><path d="M8 17h6"/></svg><span class="pdf-download-arrow" aria-hidden="true">↓</span></button>
  <div class="sep"></div>
  <button id="sheetPropsBtn" class="icon-btn" title="Propiedades de hoja" aria-label="Propiedades de hoja"><svg viewBox="0 0 24 24"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg></button>
  <div class="sep"></div>
  <select id="rowAction" aria-label="Acciones de filas" title="Insertar o eliminar filas"><option value="">Filas…</option><option value="above">Insertar arriba</option><option value="below">Insertar abajo</option><option value="end">Agregar al final</option><option value="delete">Eliminar fila seleccionada</option></select>
  <select id="colAction" aria-label="Acciones de columnas" title="Insertar o eliminar columnas"><option value="">Columnas…</option><option value="left">Insertar izquierda</option><option value="right">Insertar derecha</option><option value="end">Agregar al final</option><option value="delete">Eliminar columna seleccionada</option></select>
  <button id="mergeCells" class="icon-btn" title="Combinar celdas" aria-label="Combinar celdas"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M8 8l3 3"/><path d="M16 8l-3 3"/><path d="M8 16l3-3"/><path d="M16 16l-3-3"/><rect x="10" y="10" width="4" height="4" rx=".5"/></svg></button>
  <button id="unmergeCell" class="icon-btn" title="Descombinar celda" aria-label="Descombinar celda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M12 5v14"/><path d="m9 12-3-3"/><path d="m9 12-3 3"/><path d="m15 12 3-3"/><path d="m15 12 3 3"/></svg></button>
  <button id="addFreeText" class="icon-btn" title="Agregar texto libre" aria-label="Agregar texto libre"><svg viewBox="0 0 24 24"><path d="M5 5h10"/><path d="M10 5v14"/><path d="M7 19h6"/><path d="M18 11v6"/><path d="M15 14h6"/></svg></button>
  <button id="undoBtn" class="icon-btn" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a7 7 0 0 1 7 7"/></svg></button>
  <button id="redoBtn" class="icon-btn" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12h-9a7 7 0 0 0-7 7"/></svg></button>
  <div class="sep"></div>
  <button id="saveLocal" class="icon-btn" title="Guardar cajetín" aria-label="Guardar cajetín"><svg viewBox="0 0 24 24"><path d="M5 3h12l2 2v16H5z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/></svg></button>
  <button id="loadLocal" class="icon-btn" title="Abrir cajetín guardado" aria-label="Abrir cajetín guardado"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/><path d="M3 7v12"/><path d="m9 14 3 3 3-3"/><path d="M12 17v-6"/></svg></button>
  <div class="sep"></div>

function clone(o){return JSON.parse(JSON.stringify(o))}
function normalizeWeights(arr){
  const safe=arr.map(v=>Number.isFinite(+v)&&+v>0?+v:0); const sum=safe.reduce((a,b)=>a+b,0)||1;
  return safe.map(v=>v/sum);
}
function resolve(v){return String(v||'').replace(/\{\{([A-Z_]+)\}\}/g,(all,k)=>meta[k]??all)}
function blankCell(n){return {label:'CAMPO '+n,value:'',type:'manual',rowSpan:1,colSpan:1,hiddenBy:null,fontFamily:'Arial',fontSize:13,color:'#0f172a',backgroundColor:'#ffffff',bold:true,italic:false,textAlign:'left',verticalAlign:'start'}}
function normalizeCell(c,n){c=c||blankCell(n);return {label:c.label||'',value:c.value||'',type:c.type||'manual',rowSpan:Math.max(1,+c.rowSpan||1),colSpan:Math.max(1,+c.colSpan||1),hiddenBy:c.hiddenBy??null,mergeBackup:c.mergeBackup||null,fontFamily:c.fontFamily||'Arial',fontSize:Math.max(7,Math.min(48,+c.fontSize||13)),color:c.color||'#0f172a',backgroundColor:(typeof c.backgroundColor==='string'&&c.backgroundColor)?c.backgroundColor:'#ffffff',bold:c.bold!==false,italic:!!c.italic,textAlign:['left','center','right'].includes(c.textAlign)?c.textAlign:'left',verticalAlign:['start','center','end'].includes(c.verticalAlign)?c.verticalAlign:'start'}}
function snapshot(){return {model:clone(model),paperSize:paperSize.value,orientation:orientation.value,frameMode:frameMode.value,template:lastTemplate,titleblockVisible,logoVisible}}
function pushHistory(){if(historyLock||!model)return;undoStack.push(snapshot());if(undoStack.length>50)undoStack.shift();redoStack=[];updateHistoryButtons()}
function restoreSnapshot(snap){if(!snap)return;historyLock=true;model=clone(snap.model);model.freeTexts=model.freeTexts||[];paperSize.value=snap.paperSize||paperSize.value;orientation.value=snap.orientation||orientation.value;frameMode.value=snap.frameMode||frameMode.value;lastTemplate=(snap.template&&snap.template!=='none')?snap.template:lastTemplate;titleblockVisible=snap.titleblockVisible!==false;templateSelect.value=titleblockVisible?lastTemplate:'none';logoVisible=snap.logoVisible!==false;logo.style.display=logoVisible?'block':'none';showLogoBtn.checked=logoVisible;paper.className='paper '+paperSize.value+' '+orientation.value;applyBorder();applyTitleblockVisibility();selected=null;selectionSet.clear();mergeSelection.clear();mergeMode=false;mergeAnchor=null;document.body.classList.remove('merge-mode');selectedFreeText=null;render();historyLock=false;updateHistoryButtons()}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());restoreSnapshot(undoStack.pop());showToast('Deshacer')}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restoreSnapshot(redoStack.pop());showToast('Rehacer')}
function updateHistoryButtons(){$('undoBtn').disabled=!undoStack.length;$('redoBtn').disabled=!redoStack.length}
function showToast(msg){clearTimeout(toastTimer);toast.textContent=msg;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}

function loadTemplate(name){
  if(name==='none'){titleblockVisible=false;templateSelect.value='none';applyTitleblockVisibility();return}
  const safeName=templates[name]?name:'industrial';
  const t=clone(templates[safeName]);
  lastTemplate=safeName;titleblockVisible=true;templateSelect.value=safeName;
  model={rows:normalizeWeights(t.rows),cols:normalizeWeights(t.cols),cells:t.cells.map((x,i)=>normalizeCell({label:x[0],value:x[1],type:x[2]||'manual'},i+1)),box:{left:44,right:44,bottom:44,height:180},freeTexts:[]};
  selected=null;selectionSet.clear();selectedFreeText=null;mergeMode=false;mergeAnchor=null;mergeSelection.clear();document.body.classList.remove('merge-mode');closeModal();closeTextModal();applyTitleblockVisibility();render();
}

function cellLocation(idx){const cols=model.cols.length;return {row:Math.floor(idx/cols)+1,col:(idx%cols)+1}}

function render(){
  titleblock.innerHTML='';
  model.box=model.box||{left:44,right:44,bottom:44,height:180};model.freeTexts=model.freeTexts||[];
  model.cells=model.cells.map((c,i)=>normalizeCell(c,i+1));
  applyTitleblockBox();applyGridCSS();
  const cols=model.cols.length;
  model.cells.forEach((c,i)=>{
    if(c.hiddenBy!==null&&c.hiddenBy!==undefined)return;
    const r=Math.floor(i/cols),cc=i%cols;
    const el=document.createElement('div');
    el.className='cell'+(i===selected?' selected':'')+(c.type==='auto'?' auto':'')+((c.rowSpan>1||c.colSpan>1)?' merged':'')+(mergeSelection.has(i)?' merge-pick':'')+(selectionTouchesMaster(i)?' range-selected':'');
    el.dataset.idx=i;el.style.gridRow=(r+1)+' / span '+Math.min(c.rowSpan,model.rows.length-r);el.style.gridColumn=(cc+1)+' / span '+Math.min(c.colSpan,model.cols.length-cc);
    el.style.backgroundColor=c.backgroundColor||'#ffffff';
    el.style.fontFamily=c.fontFamily;el.style.justifyContent=c.verticalAlign==='center'?'center':c.verticalAlign==='end'?'flex-end':'flex-start';el.style.display='flex';el.style.flexDirection='column';
    const lab=document.createElement('div');lab.className='label';lab.textContent=c.label||'';
    const val=document.createElement('div');val.className='value';val.textContent=resolve(c.value||'');
    [lab,val].forEach(n=>{n.style.fontFamily=c.fontFamily;n.style.color=c.color;n.style.fontStyle=c.italic?'italic':'normal';n.style.textAlign=c.textAlign});
    lab.style.fontSize=Math.max(7,Math.round(c.fontSize*.68))+'px';lab.style.fontWeight=c.bold?'900':'600';val.style.fontSize=c.fontSize+'px';val.style.fontWeight=c.bold?'800':'400';
    el.append(lab,val);
    attachCellInteraction(el,i);
    titleblock.appendChild(el);
  });
  createDragbars();createOuterHandles();renderFreeTexts();updateMergeButtons();updateHistoryButtons();
}
function applyTitleblockVisibility(){
  document.body.classList.toggle('titleblock-hidden',!titleblockVisible);
  titleblock.style.display=titleblockVisible?'grid':'none';
  if(!titleblockVisible)schemeArea.style.bottom='44px';
  else if(model&&model.box){const b=model.box,gap=21;schemeArea.style.bottom=(b.bottom+b.height+gap)+'px'}
}
function applyTitleblockBox(){
  const b=model.box||{left:44,right:44,bottom:44,height:180};
  titleblock.style.left=b.left+'px';titleblock.style.right=b.right+'px';titleblock.style.bottom=b.bottom+'px';titleblock.style.height=b.height+'px';
  const gap=21;schemeArea.style.bottom=titleblockVisible?(b.bottom+b.height+gap)+'px':'44px';
  applyTitleblockVisibility();
}
function masterIndex(i){const c=model.cells[i];return c&&c.hiddenBy!=null?c.hiddenBy:i}
function masterBounds(i){i=masterIndex(i);const c=model.cells[i],cols=model.cols.length,r=Math.floor(i/cols),col=i%cols;return {master:i,r1:r,r2:r+Math.max(1,c?.rowSpan||1)-1,c1:col,c2:col+Math.max(1,c?.colSpan||1)-1}}
function selectionTouchesMaster(i){if(!selectionSet.size)return false;const b=masterBounds(i),cols=model.cols.length;for(let r=b.r1;r<=b.r2;r++)for(let c=b.c1;c<=b.c2;c++)if(selectionSet.has(r*cols+c))return true;return false}
function expandBoundsForMerges(r1,r2,c1,c2){const cols=model.cols.length;let changed=true;while(changed){changed=false;model.cells.forEach((cell,i)=>{if(!cell||cell.hiddenBy!=null)return;const b=masterBounds(i);const hit=!(b.r2<r1||b.r1>r2||b.c2<c1||b.c1>c2);if(hit){const nr1=Math.min(r1,b.r1),nr2=Math.max(r2,b.r2),nc1=Math.min(c1,b.c1),nc2=Math.max(c2,b.c2);if(nr1!==r1||nr2!==r2||nc1!==c1||nc2!==c2){r1=nr1;r2=nr2;c1=nc1;c2=nc2;changed=true}}})}return {r1,r2,c1,c2}}
function selectionFromCorners(a,b){const A=masterBounds(a),B=masterBounds(b);const x=expandBoundsForMerges(Math.min(A.r1,B.r1),Math.max(A.r2,B.r2),Math.min(A.c1,B.c1),Math.max(A.c2,B.c2));const set=new Set(),cols=model.cols.length;for(let r=x.r1;r<=x.r2;r++)for(let c=x.c1;c<=x.c2;c++)set.add(r*cols+c);return {set,...x}}
function gridIndexFromPoint(x,y){const rect=titleblock.getBoundingClientRect();if(x<rect.left||x>rect.right||y<rect.top||y>rect.bottom)return null;const xr=(x-rect.left)/rect.width,yr=(y-rect.top)/rect.height;let ca=0,col=model.cols.length-1;for(let c=0;c<model.cols.length;c++){ca+=model.cols[c];if(xr<=ca){col=c;break}}let ra=0,row=model.rows.length-1;for(let r=0;r<model.rows.length;r++){ra+=model.rows[r];if(yr<=ra){row=r;break}}return masterIndex(row*model.cols.length+col)}
function attachCellInteraction(el,i){
  el.addEventListener('dblclick',ev=>{if(ev.pointerType==='touch'||mergeMode)return;ev.preventDefault();ev.stopPropagation();selected=masterIndex(i);selectionSet=new Set([selected]);markSelected();openModal()});
  el.addEventListener('pointerdown',ev=>{
    if(activeDrag)return;ev.stopPropagation();

function paperDimensions(){return {w:paper.offsetWidth,h:paper.offsetHeight}}
function setZoom(next){
  zoom=Math.max(.25,Math.min(2.5,+next||1));paper.style.transform='scale('+zoom+')';
  const {w,h}=paperDimensions();paperShell.style.width=(w*zoom)+'px';paperShell.style.height=(h*zoom)+'px';zoomValue.textContent=Math.round(zoom*100)+'%';
}
function zoomAt(next,clientX,clientY){
  const old=zoom,rect=paper.getBoundingClientRect();
  const lx=(clientX-rect.left)/old,ly=(clientY-rect.top)/old;
  setZoom(next);
  requestAnimationFrame(()=>{
    const nr=paper.getBoundingClientRect();
    const dx=(nr.left+lx*zoom)-clientX,dy=(nr.top+ly*zoom)-clientY;
    workspace.scrollLeft+=dx;workspace.scrollTop+=dy;
  });
}
function nearestStep(direction){
  if(direction>0){for(const z of zoomSteps)if(z>zoom+.001)return z;return Math.min(2.5,zoom+.25)}
  for(let i=zoomSteps.length-1;i>=0;i--)if(zoomSteps[i]<zoom-.001)return zoomSteps[i];return Math.max(.25,zoom-.25);
}
function fitToWorkspace(){
  requestAnimationFrame(()=>{
    const {w,h}=paperDimensions(),style=getComputedStyle(stage);
    const padX=parseFloat(style.paddingLeft)+parseFloat(style.paddingRight),padY=parseFloat(style.paddingTop)+parseFloat(style.paddingBottom);
    const availW=Math.max(100,workspace.clientWidth-padX-16),availH=Math.max(100,workspace.clientHeight-padY-16);
    setZoom(Math.min(1.5,availW/w,availH/h));
    workspace.scrollLeft=0;workspace.scrollTop=0;
  });
}
$('zoomIn').onclick=()=>setZoom(nearestStep(1));$('zoomOut').onclick=()=>setZoom(nearestStep(-1));$('fitZoom').onclick=fitToWorkspace;
zoomValue.onclick=()=>setZoom(.75);

/* Cinta: la rueda desplaza horizontalmente las herramientas. */
topbar.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>=Math.abs(e.deltaX)){e.preventDefault();topbar.scrollLeft+=e.deltaY;}
  else{e.preventDefault();topbar.scrollLeft+=e.deltaX;}
},{passive:false});

/* PC: rueda sobre hoja o área de trabajo = zoom al cursor */
workspace.addEventListener('wheel',e=>{
  if(e.target.closest&&e.target.closest('.topbar'))return;
  e.preventDefault();
  const factor=e.deltaY<0?1.10:1/1.10;
  zoomAt(Math.max(.25,Math.min(2.5,zoom*factor)),e.clientX,e.clientY);
},{passive:false});

function isCleanPanTarget(target){
  if(!target||!target.closest)return true;
  if(target.closest('.cell,.dragbar,.outer-handle,.free-text,.modal-card,button,select,input,textarea'))return false;
  return target===workspace||target===stage||target===paperShell||target===paper||target.closest('.scheme-area')||target.closest('.frame')||target.closest('.sheet-border');
}
/* PC: arrastrar sobre zona limpia desplaza el lienzo */
workspace.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||e.button!==0||!isCleanPanTarget(e.target)||activeDrag)return;
  e.preventDefault();closeModal();
  activePan={id:e.pointerId,x:e.clientX,y:e.clientY,sl:workspace.scrollLeft,st:workspace.scrollTop};
  workspace.classList.add('panning');
  try{workspace.setPointerCapture(e.pointerId)}catch(_){}
},true);
workspace.addEventListener('pointermove',e=>{
  if(!activePan||e.pointerId!==activePan.id)return;
  e.preventDefault();workspace.scrollLeft=activePan.sl-(e.clientX-activePan.x);workspace.scrollTop=activePan.st-(e.clientY-activePan.y);
},{passive:false});
function endPan(e){if(!activePan||e.pointerId!==activePan.id)return;try{workspace.releasePointerCapture(e.pointerId)}catch(_){}activePan=null;workspace.classList.remove('panning')}
workspace.addEventListener('pointerup',endPan);workspace.addEventListener('pointercancel',endPan);

/* Móvil/tablet: 1 dedo desplaza el lienzo y 2 dedos hacen pinch zoom.
   Las celdas/handles conservan sus propios gestos de edición. */
workspace.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch')return;
  touchPoints.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(touchPoints.size===1 && isCleanPanTarget(e.target) && !activeDrag){
    touchPan={id:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,sl:workspace.scrollLeft,st:workspace.scrollTop,moved:false};
  }

  if(touchPoints.size===2){
    touchPan=null;
    const pts=[...touchPoints.values()].slice(0,2),dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y;
    pinchState={distance:Math.hypot(dx,dy)||1,zoom};
    closeModal();
  }
},true);

workspace.addEventListener('pointermove',e=>{
  if(e.pointerType!=='touch'||!touchPoints.has(e.pointerId))return;
  touchPoints.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(touchPoints.size>=2&&pinchState){
    e.preventDefault();
    touchPan=null;
    const pts=[...touchPoints.values()].slice(0,2),dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,dist=Math.hypot(dx,dy)||1;
    const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
    zoomAt(Math.max(.25,Math.min(2.5,pinchState.zoom*(dist/pinchState.distance))),mid.x,mid.y);
    return;
  }

  if(touchPan && e.pointerId===touchPan.id && touchPoints.size===1){
    const dx=e.clientX-touchPan.startX,dy=e.clientY-touchPan.startY;
    if(!touchPan.moved && Math.hypot(dx,dy)>5){touchPan.moved=true;closeModal();workspace.classList.add('panning')}
    if(touchPan.moved){
      e.preventDefault();
      workspace.scrollLeft=touchPan.sl-dx;
      workspace.scrollTop=touchPan.st-dy;
      touchPan.lastX=e.clientX;touchPan.lastY=e.clientY;
    }
  }
},{passive:false,capture:true});

function touchEnd(e){
  if(e.pointerType!=='touch')return;
  touchPoints.delete(e.pointerId);
  if(touchPan&&e.pointerId===touchPan.id){touchPan=null;workspace.classList.remove('panning')}
  if(touchPoints.size<2)pinchState=null;
}
workspace.addEventListener('pointerup',touchEnd,true);workspace.addEventListener('pointercancel',touchEnd,true);

function applyBorder(){
  const mode=frameMode.value||'simuplc';
  sheetBorder.style.display=mode==='simuplc'?'block':'none';

  if(mode==='simuplc')sheetBorder.src=orientation.value==='portrait'?BORDER_VERTICAL:BORDER_HORIZONTAL;

}

function currentPayload(){return {model:clone(model),paperSize:paperSize.value,orientation:orientation.value,frameMode:frameMode.value,logoVisible,template:lastTemplate,titleblockVisible,updatedAt:new Date().toISOString()}}
function getSavedLibrary(){try{let x=JSON.parse(localStorage.getItem(SAVED_KEY)||'[]');if((!Array.isArray(x)||!x.length)){const old=JSON.parse(localStorage.getItem('simuplc_titleblock_library_v4')||'[]');if(Array.isArray(old)&&old.length){x=old;localStorage.setItem(SAVED_KEY,JSON.stringify(old))}}return Array.isArray(x)?x:[]}catch(_){return []}}
function setSavedLibrary(list){localStorage.setItem(SAVED_KEY,JSON.stringify(list))}

  savedModal.classList.add('open');savedModal.setAttribute('aria-hidden','false');renderSavedList();
  if(mode==='save')setTimeout(()=>saveName.focus(),20);

function closeSavedModal(){savedModal.classList.remove('open');savedModal.setAttribute('aria-hidden','true')}

$('saveNamed').onclick=()=>{

/* ===== SimuPLC V25 · puente de composición PDF ===== */
const SIMUPLC_ACTIVE_TITLEBLOCK_V25='simuplc_titleblock_active_v25';
let simuplcIncomingPayload=null,simuplcImportedVisual=null,simuplcImportedNatural={w:1,h:1};
function simuplcEmbedded(){try{return new URLSearchParams(location.search).get('embedded')==='1'}catch(_){return false}}
function simuplcParentPayload(){try{return parent&&parent!==window?parent.__SIMUPLC_PDF_COMPOSER_PAYLOAD_V25:null}catch(_){return null}}
function simuplcFitImported(){
  const host=document.getElementById('simuplcImportedScheme'),v=simuplcImportedVisual;if(!host||!v)return;
  const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight),nw=Math.max(1,simuplcImportedNatural.w),nh=Math.max(1,simuplcImportedNatural.h);
  const s=Math.max(.02,Math.min(w/nw,h/nh)*.96);
  v.style.width=nw+'px';v.style.height=nh+'px';v.style.transform='translate(-50%,-50%) scale('+s+')';
}
function simuplcMakeHtmlSrcdoc(src){
  const left=-(Number(src.offsetX)||0),top=-(Number(src.offsetY)||0),w=Math.max(1,Number(src.width)||1),h=Math.max(1,Number(src.height)||1);
  const base=String(src.baseHref||location.href).replace(/"/g,'&quot;');
  return '<!doctype html><html><head><meta charset="utf-8"><base href="'+base+'">'+String(src.headAssets||'')+
   '<style>html,body{margin:0!important;padding:0!important;width:'+w+'px!important;height:'+h+'px!important;overflow:hidden!important;background:#fff!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}body{position:relative!important}.simuplc-capture-clip{position:relative!important;width:'+w+'px!important;height:'+h+'px!important;overflow:hidden!important;background:#fff!important}:root{--capture-left:'+left+'px;--capture-top:'+top+'px}'+String(src.extraCss||'')+'</style></head><body><div class="simuplc-capture-clip">'+String(src.html||'')+'</div></body></html>';
}
function simuplcLoadCircuit(payload){
 simuplcIncomingPayload=payload||null;const host=document.getElementById('simuplcImportedScheme');if(!host)return;
 host.innerHTML='';simuplcImportedVisual=null;document.body.classList.remove('simuplc-has-scheme');if(!payload||!payload.source)return;
 const src=payload.source,nw=Math.max(1,Number(src.width)||1),nh=Math.max(1,Number(src.height)||1);simuplcImportedNatural={w:nw,h:nh};
 let visual=null;
 if(src.kind==='image'&&src.dataUrl){visual=document.createElement('img');visual.alt=payload.editorLabel||'Circuito';visual.src=src.dataUrl}
 else if(src.kind==='html'){visual=document.createElement('iframe');visual.setAttribute('aria-hidden','true');visual.tabIndex=-1;visual.onload=()=>{requestAnimationFrame(simuplcFitImported);setTimeout(simuplcFitImported,80)};visual.srcdoc=simuplcMakeHtmlSrcdoc(src)}
 if(!visual)return;host.appendChild(visual);simuplcImportedVisual=visual;document.body.classList.add('simuplc-has-scheme');
 if(payload.projectName)meta.PROYECTO=payload.projectName;if(payload.editorLabel)meta.EDITOR=payload.editorLabel;if(payload.date)meta.FECHA=payload.date;
 render();requestAnimationFrame(simuplcFitImported);setTimeout(simuplcFitImported,120)
}
function simuplcApplyPlan(payload){
 const pro=!!(payload&&payload.isPro),badge=document.getElementById('simuplcPlanBadge');document.body.classList.toggle('simuplc-free-pdf',!pro);
 if(badge)badge.textContent='FREE';
 if(!pro){logoVisible=true;logo.style.display='block';showLogoBtn.checked=true;showLogoBtn.disabled=true;titleblockVisible=false;templateSelect.value='none'}else{showLogoBtn.disabled=false;templateSelect.value=titleblockVisible?lastTemplate:'none'}
 applyTitleblockVisibility();
}
function simuplcLoadActiveTitleblock(){
 try{const raw=JSON.parse(localStorage.getItem(SIMUPLC_ACTIVE_TITLEBLOCK_V25)||'null');if(!raw||!raw.model)return false;loadSavedItem({payload:raw});closeSavedModal();return true}catch(_){return false}
}
function simuplcStoreActiveTitleblock(){try{localStorage.setItem(SIMUPLC_ACTIVE_TITLEBLOCK_V25,JSON.stringify(currentPayload()))}catch(_){}}
const _simuplcOldLoadSavedItem=loadSavedItem;
loadSavedItem=function(item){_simuplcOldLoadSavedItem(item);simuplcStoreActiveTitleblock();setTimeout(simuplcFitImported,30)};
const _simuplcOldApplyTitleblockBox=applyTitleblockBox;
applyTitleblockBox=function(){_simuplcOldApplyTitleblockBox();requestAnimationFrame(simuplcFitImported)};
const _simuplcOldApplyPaper=applyPaper;
applyPaper=function(){_simuplcOldApplyPaper();setTimeout(simuplcFitImported,40)};
document.getElementById('backToSimuPLC').onclick=()=>{
  try{
    parent.postMessage({type:'SIMUPLC_PDF_COMPOSER_CLOSE_V25',source:'cajetin'},'*');
    return;
  }catch(_){}
  showToast('No se pudo volver al editor');
};
document.getElementById('printPdf').addEventListener('click',simuplcStoreActiveTitleblock,true);
try{new ResizeObserver(()=>simuplcFitImported()).observe(document.getElementById('schemeArea'))}catch(_){window.addEventListener('resize',simuplcFitImported)}
let simuplcPayloadAppliedV252=false;
function simuplcApplyIncomingV252(p){
 if(!p||!p.source)return false;
 simuplcPayloadAppliedV252=true;
 simuplcApplyPlan(p);
 if(p.isPro)simuplcLoadActiveTitleblock();
 simuplcLoadCircuit(p);
 return true;
}
window.addEventListener('message',function(ev){
 const d=ev.data||{};
 if(d.type==='SIMUPLC_CAJETIN_PAYLOAD_V252'&&d.payload){
  simuplcApplyIncomingV252(d.payload);
 }
});
function simuplcInitComposer(){
 if(simuplcEmbedded())document.body.classList.add('simuplc-embedded');

 // Compatibilidad directa si el navegador permite leer parent.
 const p=simuplcParentPayload();
 if(p)simuplcApplyIncomingV252(p);

 // Canal principal V25.2: handshake por postMessage.
 if(simuplcEmbedded()){
  try{parent.postMessage({type:'SIMUPLC_CAJETIN_READY_V252'},'*')}catch(_){}
  // Algunos WebViews/PWA pueden perder el primer mensaje durante el load.
  setTimeout(()=>{if(!simuplcPayloadAppliedV252)try{parent.postMessage({type:'SIMUPLC_CAJETIN_READY_V252'},'*')}catch(_){}},120);
  setTimeout(()=>{if(!simuplcPayloadAppliedV252)try{parent.postMessage({type:'SIMUPLC_CAJETIN_READY_V252'},'*')}catch(_){}},420);
 }
}

simuplcInitComposer();
})();
